version: "2"

services:
  network-optimizer:
    image: ghcr.io/ozark-connect/network-optimizer:2.10.1@sha256:4cb0f1e06baa67402ca60f09a0c6759badb450b12a95b3a446e2e49c36000d1c
    network_mode: host
    volumes:
      - data:/app/data
      - ssh-keys:/app/ssh-keys:ro
      - logs:/app/logs
    environment:
      BIND_LOCALHOST_ONLY: "false"
      OPENSPEEDTEST_HTTPS: "false"
      OPENSPEEDTEST_PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8042/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  speedtest:
    image: ghcr.io/ozark-connect/speedtest:2.10.1@sha256:781ebe555d62e2b0276a8fbf4a01865e64f839a024331c7600ff3f447d4f3262
    ports:
      - "3000:3000"

volumes:
  data: {}
  ssh-keys: {}
  logs: {}
