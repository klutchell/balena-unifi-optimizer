version: "2"

services:
  network-optimizer:
    image: ghcr.io/ozark-connect/network-optimizer:2.10.6@sha256:c4a09cd47fab5105c5f1fe67c663abe9046e095db30332ea64aff40dd75869d4
    network_mode: host
    volumes:
      - data:/app/data
      - ssh-keys:/app/ssh-keys:ro
      - logs:/app/logs
    environment:
      BIND_LOCALHOST_ONLY: "false"
      OPENSPEEDTEST_HTTPS: "false"
      OPENSPEEDTEST_PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8042/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  speedtest:
    image: ghcr.io/ozark-connect/speedtest:2.10.6@sha256:d6d6868f5b80ad88940ef52ab8d24b0868db3861d274ea74fcd5398d8c61594f
    ports:
      - "3000:3000"

volumes:
  data: {}
  ssh-keys: {}
  logs: {}
